<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>Genus Coffee Box seal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<svg width="{{size}}" height="{{size}}" viewBox="0 0 240 240" role="img" aria-label="Genus Coffee Box seal {{num}}">
  <defs>
    <pattern id="{{pid}}" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M2 16V2h14v12H6V6h6v4" fill="none" stroke="#fdf7ea" stroke-width="2"></path>
    </pattern>
    <path id="{{aid}}" d="M120 120m-92 0a92 92 0 1 1 184 0a92 92 0 1 1 -184 0"></path>
  </defs>
  <circle cx="120" cy="120" r="118" fill="{{ring}}"></circle>
  <circle cx="120" cy="120" r="78" fill="#17130d"></circle>
  <path d="M120 42a78 78 0 1 1 0 156a78 78 0 1 1 0 -156M120 62a58 58 0 1 0 0 116a58 58 0 1 0 0 -116" fill="{{patternUrl}}" fill-rule="evenodd"></path>
  <circle cx="120" cy="120" r="56" fill="#17130d"></circle>
  <text font-family="IBM Plex Mono, monospace" font-size="15" font-weight="500" letter-spacing="3.2" fill="{{arcInk}}"><textPath href="{{arcHref}}">GENUS COFFEE BOX · ORADEA · LUNAR ·</textPath></text>
  <text x="120" y="138" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="56" font-weight="700" fill="#fdf7ea">{{num}}</text>
  <text x="120" y="160" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" letter-spacing="2" fill="#fdf7ea">{{label}}</text>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"num":{"editor":"text","default":"3"},"label":{"editor":"text","default":"PRĂJITORII"},"ring":{"editor":"color","default":"#ff5140","options":["#ff5140","#0f7a44","#b5760f","#d9c3a0"]},"arcInk":{"editor":"color","default":"#17130d","options":["#17130d","#fdf7ea"]},"size":{"editor":"int","default":240,"min":40,"max":400},"uid":{"editor":null,"default":"s"},"$preview":{"width":240,"height":240}}'>
class Component extends DCLogic {
renderVals() {
const uid = this.props.uid ?? 's';
return {
num: this.props.num ?? '3',
label: this.props.label ?? 'PRĂJITORII',
ring: this.props.ring ?? '#ff5140',
arcInk: this.props.arcInk ?? '#17130d',
size: this.props.size ?? 240,
pid: 'mz-' + uid,
aid: 'arc-' + uid,
patternUrl: 'url(#mz-' + uid + ')',
arcHref: '#arc-' + uid
};
}
}
</script>
</body>
</html>
