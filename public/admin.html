<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — Genus Coffee</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%98%95%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/app.css">
</head>
<body>
  <div id="site-nav"></div>

  <main class="container" style="padding: 40px 0 90px">
    <div id="admin-gate"></div>

    <div id="admin-app" hidden>
      <div class="admin-head">
        <h1>Dashboard</h1>
        <div class="admin-user">
          <span id="admin-email"></span>
          <button class="btn btn--secondary btn--sm" id="signout" type="button">Sign out</button>
        </div>
      </div>
      <div class="admin-tabs">
        <button class="admin-tab is-active" data-tab="products" type="button">Products</button>
        <button class="admin-tab" data-tab="orders" type="button">Orders</button>
        <button class="admin-tab" data-tab="bookings" type="button">Bookings</button>
        <button class="admin-tab" data-tab="discounts" type="button">Discounts</button>
        <button class="admin-tab" data-tab="subscriptions" type="button">Subscriptions</button>
        <button class="admin-tab" data-tab="box" type="button">Box</button>
        <button class="admin-tab" data-tab="pastevents" type="button">Past events</button>
      </div>
      <div id="admin-panel"></div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
