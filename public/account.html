<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contul meu — Genus Coffee Box</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/box/seals/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/styles/tokens.css">
<link rel="stylesheet" href="/styles/base.css">
<link rel="stylesheet" href="/styles/app.css">
<link rel="stylesheet" href="/styles/box.css">
<style>
  .ac { max-width: 960px; margin: 0 auto; padding: 28px 16px 64px; display: flex; flex-direction: column; gap: 20px; }
  .ac h1 { margin: 0; }
  .ac h2 { margin: 0; font-size: 22px; }
  .ac-card { background: var(--paper-100); border: var(--border-w) solid var(--ink-950); border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .ac-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
  .ac-pill { display: inline-block; font-family: var(--font-display); font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; padding: 6px 14px; border: var(--border-w) solid var(--ink-950); border-radius: var(--radius-full); background: var(--green); color: var(--ink-950); }
  .ac-pill--warn { background: var(--gold); }
  .ac-dates { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .ac-dates dt { font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-secondary); }
  .ac-dates dd { margin: 2px 0 0; font-family: var(--font-mono); font-size: 15px; }
  .ac-coffees { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .ac-coffee { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; border: 2px solid var(--ink-950); border-radius: var(--radius-sm); padding: 12px 14px; background: var(--paper-50); }
  .ac-coffee small { display: block; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-secondary); }
  .ac-coffee strong { font-family: var(--font-display); }
  .ac-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .ac .btn, .ac .select, .ac .input { min-height: 44px; }
  .ac .btn[disabled] { opacity: .5; cursor: not-allowed; }
  .ac-late { font-size: 14px; font-weight: 600; }
  .ac-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 760px) { .ac-grid { grid-template-columns: 1fr; } }
  .ac-taste { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .ac-taste li { border: 2px solid var(--ink-950); border-radius: var(--radius-full); padding: 6px 12px; font-size: 14px; background: var(--paper-50); }
  .ac-ratings { width: 100%; border-collapse: collapse; font-size: 14px; }
  .ac-ratings th, .ac-ratings td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--ink-950); vertical-align: top; }
  .ac-ratings th { font-family: var(--font-display); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
  .ac-star { color: var(--ink-950); letter-spacing: 2px; font-size: 16px; }
  .ac-signin { max-width: 460px; }
  .notice[hidden] { display: none; }
</style>
</head>
<body>
<div id="site-nav"></div>
<main>
  <div class="ac" id="ac"><p role="status">Se încarcă…</p></div>
</main>
<div id="site-footer"></div>
<script type="module" src="/js/account.js"></script>
</body>
</html>
